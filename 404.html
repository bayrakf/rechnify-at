<!DOCTYPE html>
<html lang="de-AT">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>404 – Seite nicht gefunden | rechnify.at</title>
  <link rel="stylesheet" href="/tokens.css?v=1.2" />
  <link rel="stylesheet" href="/assets/css/global.css?v=3.1" />
  <style>
    .error-wrap {
      text-align: center;
      padding: var(--space-3xl) var(--space-md);
      max-width: 600px;
      margin: 0 auto;
    }
    .error-code {
      font-family: var(--font-display);
      font-size: 5rem;
      font-weight: 700;
      color: var(--color-accent);
      line-height: 1;
      margin-bottom: var(--space-xs);
    }
    .error-wrap h1 {
      font-size: var(--text-2xl);
      margin-bottom: var(--space-sm);
    }
    .error-wrap p {
      color: var(--color-ink-2);
      margin-bottom: var(--space-lg);
    }
  </style>
</head>
<body>
  <header class="site-header">
    <div class="header-inner">
      <a href="/" class="site-logo">
        <span class="site-logo-text">rechnify<span>.at</span></span>
      </a>
    </div>
  </header>
  <main class="site-main">
    <div class="error-wrap">
      <div class="error-code">404</div>
      <h1>Seite nicht gefunden</h1>
      <p>Die angeforderte Seite existiert leider nicht oder wurde verschoben.</p>
      <a href="/" class="btn">Zur Startseite</a>
    </div>
  </main>
</body>
</html>
